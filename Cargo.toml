[workspace]
members = ["."]
resolver = "2"

[package]
name = "envoy"
version = "0.1.0"
edition = "2021"
description = "Message/coordination server for AI coding agents using sqlitegraph pub/sub"
license = "GPL-3.0"
repository = "https://github.com/oldnordic/envoy"

[dependencies]
sqlitegraph = "2.2.2"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
tower-http = { version = "0.6", features = ["cors"] }
futures = "0.3"
tower = { version = "0.5", features = ["util"] }
ahash = "0.8"
parking_lot = "0.12"
hyper = { version = "1.0", features = ["full"] }
# Atheneum is optional - only enabled when the local path exists
atheneum = { path = "../atheneum", optional = true }


[dev-dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.26"
tempfile = "3"
http-body-util = "0.1"

[features]
default = []
# atheneum feature enables the envoy-atheneum bridge and atheneum dependency
atheneum = ["dep:atheneum"]

[[bin]]
name = "envoy"
path = "src/main.rs"
