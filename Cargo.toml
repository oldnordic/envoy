[package]
name = "agent-envoy"
version = "0.3.0"
edition = "2021"
description = "Message/coordination server for AI coding agents using sqlitegraph pub/sub"
license = "GPL-3.0-only"
repository = "https://github.com/oldnordic/envoy"
homepage = "https://github.com/oldnordic/envoy"
documentation = "https://github.com/oldnordic/envoy/blob/master/MANUAL.md"
keywords = ["agent", "coordination", "messaging", "language-model", "sqlite"]
categories = ["network-programming", "database-implementations", "asynchronous"]
authors = ["oldnordic"]
readme = "README.md"
rust-version = "1.87"

[dependencies]
sqlitegraph = "3.0.7"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
tower-http = { version = "0.6", features = ["cors", "request-id", "trace", "timeout", "util"] }
futures = "0.3"
tower = { version = "0.5", features = ["util"] }
ahash = "0.8"
parking_lot = "0.12"
hyper = { version = "1.0", features = ["full"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
atheneum = { path = "../atheneum/crates/atheneum", version = "0.7", optional = true }
ureq = { version = "2", default-features = false, features = ["json"] }

[dev-dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.26"
tempfile = "3"
http-body-util = "0.1"
[features]
default = ["atheneum"]
atheneum = ["dep:atheneum"]

[lib]
name = "envoy"
path = "src/lib.rs"

[[bin]]
name = "envoy"
path = "src/main.rs"

[[bin]]
name = "envoy-hook"
path = "src/bin/hook.rs"
